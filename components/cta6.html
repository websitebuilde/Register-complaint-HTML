<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Register complaint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style data-tag="default-style-sheet">
      html {
        font-family: Inter;
        font-size: 16px;
      }

      body {
        font-weight: 400;
        font-style:normal;
        text-decoration: none;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.15;
        color: var(--dl-color-gray-black);
        background: var(--dl-color-gray-white);

        fill: var(--dl-color-gray-black);
      }

    <link
      rel="stylesheet"
      href="https://unpkg.com/animate.css@4.1.1/animate.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
      data-tag="font"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@teleporthq/teleport-custom-scripts/dist/style.css"
    />
  </head>
  <body>
    <link rel="stylesheet" href="../style.css" />
    <div>
      <link href="./cta6.css" rel="stylesheet" />
      <div class="cta6-container1 thq-section-padding cta6">
        <div class="cta6-max-width thq-section-max-width">
          <div class="cta6-column">
            <div class="cta6-content">
              <span>

                      type="text"
                      placeholder="Enter your email"

                    />
                    <button type="button" class="thq-button-filled">
                      <span>
                        <fragment class="cta6-fragment1">
                          <span class="cta6-text3">Contact Us</span>
                        </fragment>
                      </span>

                  </div>
                </div>

    <script
      defer=""
      src="https://unpkg.com/@teleporthq/react-components/dist/animate-on-reveal.umd.js"
    ></script>
