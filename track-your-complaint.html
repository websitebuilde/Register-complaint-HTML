<!DOCTYPE html>
<html lang="en">
  <head>

    <meta

      content="Track-your-complaint - Register complaint"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      body {

    <link

      data-tag="font"
    />
    <link

  <body>
    <link rel="stylesheet" href="./style.css" />
    <div>
      <link href="./track-your-complaint.css" rel="stylesheet" />

      <div class="track-your-complaint-container1">
        <section class="track-your-complaint-hero">
          <header class="track-your-complaint-header">
            <div
              id="mobile-menu"
              class="track-your-complaint-mobile-navigation"
            >
              <img
                alt="pastedImage"
                src="public/pastedimage-no9b-1500h.png"
                class="track-your-complaint-logo1"
              />
              <div class="track-your-complaint-links1">
                <span class="Link">Solutions</span>
                <span class="Link">How it works</span>
                <span class="Link">Prices</span>
              </div>
              <div
                id="close-mobile-menu"
                class="track-your-complaint-close-mobile-menu"
              >
                <svg
                  viewBox="0 0 804.5714285714286 1024"
                  class="track-your-complaint-icon1"
                >
                  <path
                    d="M741.714 755.429c0 14.286-5.714 28.571-16 38.857l-77.714 77.714c-10.286 10.286-24.571 16-38.857 16s-28.571-5.714-38.857-16l-168-168-168 168c-10.286 10.286-24.571 16-38.857 16s-28.571-5.714-38.857-16l-77.714-77.714c-10.286-10.286-16-24.571-16-38.857s5.714-28.571 16-38.857l168-168-168-168c-10.286-10.286-16-24.571-16-38.857s5.714-28.571 16-38.857l77.714-77.714c10.286-10.286 24.571-16 38.857-16s28.571 5.714 38.857 16l168 168 168-168c10.286-10.286 24.571-16 38.857-16s28.571 5.714 38.857 16l77.714 77.714c10.286 10.286 16 24.571 16 38.857s-5.714 28.571-16 38.857l-168 168 168 168c10.286 10.286 16 24.571 16 38.857z"
                  ></path>
                </svg>
              </div>
            </div>
            <div class="track-your-complaint-desktop-navigation">
              <nav class="track-your-complaint-centered">
                <div class="track-your-complaint-left1">
                  <a href="index.html" class="track-your-complaint-navlink1">
                    <img
                      alt="pastedImage"
                      src="public/pastedimage-no9b-1500h.png"
                      class="track-your-complaint-logo2"
                    />
                  </a>
                  <div class="track-your-complaint-links2"></div>
                </div>
                <div class="track-your-complaint-right1">
                  <a
                    href="registeracomplainthtml.html"
                    class="track-your-complaint-navlink2"
                  >
                    <div class="track-your-complaint-get-started1">
                      <span class="track-your-complaint-text13">
                        Track your complaint
                      </span>
                    </div>
                  </a>
                  <a
                    href="registeracomplainthtml.html"
                    class="track-your-complaint-navlink3"
                  >
                    <div class="track-your-complaint-get-started2">
                      <span class="track-your-complaint-text14">
                        Report a complant
                      </span>
                    </div>
                  </a>
                  <div
                    id="open-mobile-menu"
                    class="track-your-complaint-burger-menu"
                  >
                    <img
                      alt="pastedImage"
                      src="public/pastedimage-yxbd.svg"
                      class="track-your-complaint-mobile-menu-button"
                    />
                  </div>
                </div>
              </nav>
            </div>
            <div>
              <div class="track-your-complaint-container3">
                <script defer="">
                  /*
                  Mobile menu - Code Embed
                  */

                  // Mobile menu
                  const mobileMenu = document.querySelector('#mobile-menu')

                  // Buttons
                  const closeButton = document.querySelector('#close-mobile-menu')
                  const openButton = document.querySelector('#open-mobile-menu')

                  // On openButton click, set the mobileMenu position left to -100vw
                  openButton.addEventListener('click', function() {
                      mobileMenu.style.transform = 'translateX(0%)'
                  })

                  // On closeButton click, set the mobileMenu position to 0vw
                  closeButton.addEventListener('click', function() {
                      mobileMenu.style.transform = 'translateX(100%)'
                  })
                </script>
              </div>
            </div>
          </header>
        </section>
        <contact-form4-wrapper
          class="contact-form4-wrapper"
          rootclassname="contact-form4undefined"
        >
          <!--ContactForm4 component-->
          <div
            class="contact-form4-contact9 thq-section-padding contact-form4root-class-name"
          >
            <div
              class="thq-section-max-width thq-flex-row contact-form4-max-width"
            >
              <div class="contact-form4-content1 thq-flex-column">
                <div class="contact-form4-section-title thq-card">
                  <div class="contact-form4-content2">
                    <h2>
                      <fragment class="track-your-complaint-fragment2">
                        <span class="track-your-complaint-text18 thq-heading-2">
                          Track your complaint
                        </span>
                      </fragment>
                    </h2>
                  </div>
                </div>
                <form class="thq-card">
                  <div class="contact-form4-input">
                    <label for="contact-form-4-email" class="thq-body-small">
                      Tracking number
                    </label>
                    <input
                      type="number"
                      id="contact-form-4-email"
                      required="true"
                      placeholder="Tracking number"
                      class="thq-input"
                    />
                  </div>
                  <button
                    type="submit"
                    class="contact-form4-button thq-button-filled"
                  >
                    <span>
                      <fragment class="track-your-complaint-fragment1">
                        <span
                          class="track-your-complaint-text15 thq-body-small"
                        >
                          <span>Submit</span>
                          <br />
                        </span>
                      </fragment>
                    </span>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </contact-form4-wrapper>
        <footer id="Solutions" class="track-your-complaint-footer">
          <div class="track-your-complaint-top">
            <div class="track-your-complaint-left2">
              <div class="track-your-complaint-contact">
                <span class="track-your-complaint-text19">Contact</span>
                <a
                  href="mailto:use@active-app.com?subject=Support"
                  class="track-your-complaint-link"
                >
                  departmentofconsumerrights@gov.aaron
                </a>
              </div>
            </div>
            <div class="track-your-complaint-right2">
              <div class="track-your-complaint-category"></div>
            </div>
          </div>
          <div class="track-your-complaint-bottom">
            <img
              alt="pastedImage"
              src="public/pastedimage-no9b-1500h.png"
              class="track-your-complaint-branding"
            />
            <span class="track-your-complaint-text20">
              Copyright © Government of AARON - 2024
            </span>
          </div>
        </footer>
      </div>
    </div>
    <script
      defer=""
      src="https://unpkg.com/@teleporthq/react-components/dist/animate-on-reveal.umd.js"
    ></script>
  </body>
</html>
