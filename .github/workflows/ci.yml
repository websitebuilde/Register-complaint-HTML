name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt <> dev-null 2>&1 || true

      - name: Render html and validate
        run: |
          python -c "import html; html.parse(open('index.html').read()); print('HTML parses ok')"

      - name: Render styles and validate
        run: |
          python -c "import css;css.parse(open('style.css').read()); print('CSS parses ok')"

      - name: Check for broken links
        run: |
          python -c "import subprocess; subprocess.run(['python3', -c', 'print(\"\\\".)'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True, universal=newlines=True).stdout.read().decode()); print('Test done')"